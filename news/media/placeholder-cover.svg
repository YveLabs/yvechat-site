<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="YveChat Newsroom">
  <defs>
    <radialGradient id="glowA" cx="24%" cy="26%" r="62%">
      <stop offset="0" stop-color="#3DBA72" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b1410" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="20%" r="55%">
      <stop offset="0" stop-color="#1F9D5A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0b1410" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="60%" cy="108%" r="70%">
      <stop offset="0" stop-color="#45D483" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0b1410" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafff2"/>
      <stop offset="1" stop-color="#a8c4b0"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e8f0eb" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="dotMask" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade"><rect width="1600" height="900" fill="url(#dotMask)"/></mask>
  </defs>

  <rect width="1600" height="900" fill="#0b1410"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>
  <rect width="1600" height="900" fill="url(#glowC)"/>
  <rect width="1600" height="900" fill="url(#dots)" mask="url(#fade)"/>

  <!-- emblem -->
  <g transform="translate(800 356)">
    <circle r="118" fill="#0f1a14" fill-opacity="0.55" stroke="#3DBA72" stroke-opacity="0.5" stroke-width="2"/>
    <circle r="150" fill="none" stroke="#3DBA72" stroke-opacity="0.18" stroke-width="1.5"/>
    <g transform="translate(-46 -52) scale(3.05)" fill="#3DBA72">
      <path d="M15 2 C13 8 9 12 3 14 C9 16 13 20 15 26 C17 20 21 16 27 14 C21 12 17 8 15 2 Z" fill-opacity="0.9"/>
    </g>
  </g>

  <text x="800" y="592" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="26" letter-spacing="14" fill="#3DBA72" font-weight="700">NEWSROOM</text>
  <text x="800" y="672" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="72" fill="url(#ink)" font-weight="500">YveChat</text>
  <text x="800" y="726" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="19" letter-spacing="4" fill="#a8c4b0" fill-opacity="0.8">Sovereign AI, in the open</text>
</svg>
